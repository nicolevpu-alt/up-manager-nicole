name: Add indicators dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-indicators-dashboard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar painel
        run: python .github/scripts/add_indicators.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Adiciona painel de indicadores e histórico diário"
          git push
