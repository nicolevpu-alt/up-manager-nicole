name: Fix em contato pensando

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-em-contato-pensando.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar contador Em contato
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "emContato=ativos.filter(c=>['Primeiro contato','Segundo contato','Terceiro contato'].includes(c.status))"
          new = "emContato=ativos.filter(c=>['Primeiro contato','Segundo contato','Terceiro contato','Pensando'].includes(c.status))"
          if old not in s:
              raise SystemExit('Trecho esperado não encontrado')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Inclui Pensando no contador Em contato"
          git push
